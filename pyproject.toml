[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "owbm"
version = "1.0.0"
description = "OpenWrt Backup & Restore Manager: резервное копирование, проверка, восстановление и перенос устройств по SSH"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["openwrt", "backup", "restore", "migration", "ssh", "router"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
owbm = "owbm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
